<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#14213d">
<title>Revoada — Controle</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden;background:#14213d;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
  .screen.on{display:flex}

  /* Entrada */
  #join{justify-content:center;gap:16px;text-align:center}
  #join h1{font-size:44px;letter-spacing:-.02em}
  #join p{opacity:.8;font-size:17px;line-height:1.4}
  input{font:inherit;font-size:22px;padding:14px 16px;border-radius:14px;border:0;text-align:center;width:100%;user-select:text;-webkit-user-select:text}
  .btn{font:inherit;font-size:22px;font-weight:800;padding:16px;border:0;border-radius:14px;background:#ff5a36;color:#fff;width:100%}
  .err{color:#ffb3a3;font-size:15px;min-height:20px}

  /* Jogo */
  #top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:20px}
  #me{display:flex;align-items:center;gap:8px}
  .dot{width:18px;height:18px;border-radius:50%}
  #score{font-size:26px}
  #status{text-align:center;font-size:15px;opacity:.8;margin:8px 0;min-height:20px}
  #preview{position:relative;align-self:center;width:62%;aspect-ratio:16/9;border:2px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(255,255,255,.06);margin-bottom:10px}
  #pdot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;left:50%;top:50%}
  #tools{display:flex;gap:10px;margin-bottom:12px}
  #tools button{flex:1;font:inherit;font-size:15px;font-weight:700;padding:12px 8px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff}
  #tools button.on{background:rgba(255,255,255,.4)}
  #fire{flex:1;border:0;border-radius:28px;font:inherit;font-size:42px;font-weight:900;color:#fff;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;transition:transform .05s}
  #fire small{font-size:15px;font-weight:600;opacity:.85;letter-spacing:0}
  #fire.pressed{transform:scale(.97);filter:brightness(1.25)}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
  #msg{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:52px;font-weight:900;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;text-shadow:0 4px 0 rgba(0,0,0,.3)}
  #msg.show{opacity:1;transform:translateY(-14px)}
</style>
</head>
<body>

<section id="join" class="screen on">
  <h1>Revoada 🎯</h1>
  <p>Seu celular é a mira. Aponte para o telão e toque no botão para atirar.</p>
  <input id="name" maxlength="12" placeholder="Seu nome" autocomplete="off">
  <button class="btn" id="go">Entrar no jogo</button>
  <div class="err" id="err"></div>
</section>

<section id="play" class="screen">
  <div id="top"><div id="me"><span class="dot" id="mydot"></span><span id="myname"></span></div><div id="score">0</div></div>
  <div id="status">Aponte o topo do celular para o telão e toque em “Centralizar”</div>
  <div id="preview"><div id="pdot"></div></div>
  <div id="tools">
    <button id="center">🎯 Centralizar</button>
    <button id="invx">⇆ Inverter</button>
    <button id="invy">⇅ Inverter</button>
  </div>
  <button id="fire">FOGO!<small id="hint">toque para atirar</small></button>
</section>

<div id="flash"></div>
<div id="msg"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  // Quantos graus de giro atravessam a tela inteira (menor = mais sensível)
  const RANGE_X = 45;
  const RANGE_Y = 30;

  const $ = (id) => document.getElementById(id);
  const socket = io();
  let me = null, x = .5, y = .5, tilt = 30;
  let sensorOk = false, touchMode = false, lastSent = { x: -1, y: -1 }, lastSendT = 0;
  const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
  let invX = store.get('invx') === '1', invY = store.get('invy') === '1';
  $('invx').classList.toggle('on', invX); $('invy').classList.toggle('on', invY);
  $('name').value = store.get('name') || '';

  const clamp = (v) => Math.max(0, Math.min(1, v));

  // ---------- Entrar ----------
  $('go').onclick = async () => {
    const name = $('name').value.trim();
    if (!name) { $('err').textContent = 'Digite seu nome 🙂'; return; }
    store.set('name', name);

    if (!window.isSecureContext) {
      $('err').textContent = 'Os sensores só funcionam em HTTPS. Usando modo touchpad.';
    }
    // iPhone: permissão precisa ser pedida dentro de um toque do usuário
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const r = await DeviceMotionEvent.requestPermission();
        if (r !== 'granted') $('err').textContent = 'Sem permissão de movimento. Usando modo touchpad.';
      }
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission();
      }
    } catch (e) {}

    startSensors();
    socket.emit('join', name);
    try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
    setTimeout(() => { if (!sensorOk) enableTouch(); }, 2000);
  };

  socket.on('joined', (p) => {
    me = p;
    $('join').classList.remove('on'); $('play').classList.add('on');
    $('mydot').style.background = p.color; $('myname').textContent = p.name;
    $('fire').style.background = p.color; $('pdot').style.background = p.color;
  });

  // Reconexão (ex.: celular bloqueou a tela): entra de novo com o mesmo nome
  socket.on('connect', () => { if (me) socket.emit('join', me.name); });

  // ---------- Giroscópio ----------
  function startSensors(){
    addEventListener('deviceorientation', (e) => { if (e.beta != null) tilt = e.beta; });
    let lt = 0;
    addEventListener('devicemotion', (e) => {
      const r = e.rotationRate;
      if (!r || r.alpha == null) return;
      const now = performance.now();
      if (!lt) { lt = now; return; }
      const dt = Math.min((now - lt) / 1000, .1); lt = now;
      if (!sensorOk) { sensorOk = true; touchMode = false; }
      // Giro horizontal no mundo: mistura eixo Z (celular deitado) e Y (celular em pé) conforme a inclinação
      const b = Math.max(0, Math.min(90, tilt)) * Math.PI / 180;
      const yaw = r.alpha * Math.cos(b) + r.gamma * Math.sin(b);
      const pitch = r.beta;
      x = clamp(x - (invX ? -1 : 1) * yaw * dt / RANGE_X);
      y = clamp(y - (invY ? -1 : 1) * pitch * dt / RANGE_Y);
    });
  }

  // ---------- Modo touchpad (sem sensor / teste no computador) ----------
  function enableTouch(){
    touchMode = true;
    $('status').textContent = 'Sem giroscópio: arraste no quadro para mirar';
    let px = null, py = null;
    const pv = $('preview');
    pv.addEventListener('pointerdown', (e) => { px = e.clientX; py = e.clientY; pv.setPointerCapture(e.pointerId); });
    pv.addEventListener('pointermove', (e) => {
      if (px == null) return;
      const rc = pv.getBoundingClientRect();
      x = clamp(x + (e.clientX - px) / rc.width); y = clamp(y + (e.clientY - py) / rc.height);
      px = e.clientX; py = e.clientY;
    });
    pv.addEventListener('pointerup', () => { px = py = null; });
  }

  // ---------- Botões ----------
  $('center').onclick = () => { x = .5; y = .5; buzz(15); };
  $('invx').onclick = () => { invX = !invX; store.set('invx', invX ? '1' : '0'); $('invx').classList.toggle('on', invX); };
  $('invy').onclick = () => { invY = !invY; store.set('invy', invY ? '1' : '0'); $('invy').classList.toggle('on', invY); };

  const fire = $('fire');
  let lastShot = 0;
  fire.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const now = performance.now();
    if (now - lastShot < 220) return;     // limite de cadência
    lastShot = now;
    socket.emit('shoot', { x, y });
    fire.classList.add('pressed'); buzz(25);
  });
  const release = () => fire.classList.remove('pressed');
  fire.addEventListener('pointerup', release); fire.addEventListener('pointercancel', release);

  // ---------- Retorno do telão ----------
  socket.on('result', (r) => {
    $('score').textContent = r.score;
    if (r.hit) {
      flash(me ? me.color : '#fff');
      show(r.points ? (r.golden ? `+${r.points} ✨` : `+${r.points}`) : 'Acertou!');
      buzz([40, 30, 60]);
    }
  });

  socket.on('state', (st) => {
    if (!st) return;
    if (st.state === 'playing') {
      $('score').textContent = '0'; $('hint').textContent = 'valendo pontos!';
      show('Valendo!'); buzz([60, 40, 60]);
    } else if (st.state === 'over') {
      const mine = (st.ranking || []).find((p) => me && p.id === socket.id);
      $('hint').textContent = 'toque para treinar';
      show(mine ? `${mine.pos}º lugar!` : 'Fim!');
    } else {
      $('hint').textContent = 'treino: toque para atirar';
    }
  });

  // ---------- Envio da mira (~30x por segundo, só quando muda) ----------
  function sendLoop(now){
    if (me && now - lastSendT > 33 && (Math.abs(x - lastSent.x) > .001 || Math.abs(y - lastSent.y) > .001)) {
      socket.volatile.emit('aim', { x, y });
      lastSent = { x, y }; lastSendT = now;
    }
    $('pdot').style.left = (x * 100) + '%'; $('pdot').style.top = (y * 100) + '%';
    requestAnimationFrame(sendLoop);
  }
  requestAnimationFrame(sendLoop);

  // ---------- Efeitos ----------
  function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }  // iPhone ignora
  function flash(c){ const f = $('flash'); f.style.background = c; f.style.transition = 'none'; f.style.opacity = .55; requestAnimationFrame(() => { f.style.transition = 'opacity .3s'; f.style.opacity = 0; }); }
  let msgT;
  function show(t){ const m = $('msg'); m.textContent = t; m.classList.add('show'); clearTimeout(msgT); msgT = setTimeout(() => m.classList.remove('show'), 900); }
})();
</script>
</body>
</html>
